name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    # JS gate: lint, type-check, unit tests, web build. GitHub-hosted Linux is
    # not billing-blocked (only macOS/Windows are). A self-hosted Linux runner
    # can be added later by mirroring the app repo's ci/runner/ setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    # Debug APK assemble. ubuntu-latest ships the Android SDK; only JDK 21 needs
    # selecting. Skips cleanly until the Capacitor android/ project is generated.
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -d android ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "android/ not generated yet — skipping"; fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - if: steps.guard.outputs.present == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android && ./gradlew assembleDebug
      - if: steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
