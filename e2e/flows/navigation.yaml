appId: ai.minutist.companion
---
# navigation.yaml — tab-bar round-trip: Capture -> Meetings -> Capture.
#
# UIAutomator text values:
#   "Ready"                   — status label in Capture view (inactive state)
#   "Start recording"         — aria-label on the Record button
#   "Meetings"                — tab label and Meetings heading
#   "Product roadmap review"  — fixture synced meeting; matches inside the row's
#                               "Open <title>" accessible name and the visible title
- launchApp:
    appId: ai.minutist.companion
    clearState: true
    permissions:
      all: allow

# App opens on Capture tab.
- assertVisible: "Ready"
- assertVisible: "Start recording"

# Navigate to Meetings — fixture data is loaded synchronously by MockSyncClient.
- tapOn: "Meetings"
- assertVisible: "Meetings"
# The synced row is a <button> with aria-label "Open <title>"; Maestro sees that
# accessible name, not the inner title <p>, so match the full name.
- assertVisible: "Open Product roadmap review"

# Navigate back to Capture.
- tapOn: "Capture"
- assertVisible: "Ready"
- assertVisible: "Start recording"
