name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    # JS gate: lint, type-check, unit tests, web build. GitHub-hosted Linux is
    # not billing-blocked (only macOS/Windows are). A self-hosted Linux runner
    # can be added later by mirroring the app repo's ci/runner/ setup.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    # Compile + Robolectric gate. ubuntu-latest ships the Android SDK; only
    # JDK 21 needs selecting. No emulator / KVM required — testDebugUnitTest
    # runs on the JVM via Robolectric. Skips cleanly until the Capacitor
    # android/ project is generated.
    #
    # This job proves the committed UniFFI bindings (java/uniffi/sync_ffi/),
    # JNA, and the SyncPlugin Kotlin all compile and that the APK links. It
    # does NOT produce a functional APK: libsync_ffi.so is cross-compiled from
    # the PRIVATE desktop repo (Minutist/minutist crates/sync-ffi) and is not
    # reachable from a GitHub-hosted runner without a cross-repo read token.
    # The shippable APK is built via `npm run build:sync-ffi` + gradle locally
    # or on `step` (see docs/BUILD.md). Wiring the .so into CI is tracked
    # separately (needs a cross-repo token or a published native artifact).
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - id: guard
        run: |
          if [ -d android ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT"; echo "android/ not generated yet — skipping"; fi
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - if: steps.guard.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.guard.outputs.present == 'true'
        run: |
          npm ci
          npm run build
          npx cap sync android
          cd android && ./gradlew testDebugUnitTest assembleDebug
      - if: steps.guard.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          # Shell APK: compiles and links, but has no libsync_ffi.so — it will
          # JNI-fail at runtime the moment sync starts. Kept for manifest /
          # resource-packaging inspection only, NOT for installing.
          name: app-debug-apk-no-native
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
