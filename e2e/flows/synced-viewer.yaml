appId: ai.minutist.companion
---
# synced-viewer.yaml — sync a captured-unprocessed meeting and open its detail.
#
# Seeds a captured-unprocessed item via the record flow, triggers Sync now,
# confirms the item transitions to synced (badge gone), then opens the detail
# and asserts the mock summary text.
#
# UIAutomator text values:
#   "Start recording" / "Stop recording"  — aria-label on recorder buttons
#   "Recorded — awaiting a desktop"       — badge on the captured-unprocessed row
#   "Sync now"                            — sync button text (no aria-label override)
#   aria-label on the synced row button   = meeting.title = the generated date string
#   "Mock summary — desktop processed."   — summary text rendered in MeetingDetail
#
# The two fixture meetings are "Product roadmap review" and "Design token sync check".
# The newly-synced meeting always gets a locale date title ("Jun 23, 2026, …") so
# the regex "Jun.*2026.*" uniquely identifies it without depending on the exact time.
#
# RECORD_AUDIO is granted via permissions: { all: allow } in launchApp.
- launchApp:
    appId: ai.minutist.companion
    clearState: true
    permissions:
      all: allow

# --- seed a captured-unprocessed item via the record flow ---
- assertVisible: "Ready"
- tapOn: "Start recording"
- assertVisible: "Recording"
- tapOn: "Stop recording"

# App navigates to Meetings after stop.
- assertVisible: "Recorded — awaiting a desktop"

# --- trigger mock sync ---
- tapOn: "Sync now"

# After sync, the badge disappears — the item is now a synced meeting.
- assertNotVisible: "Recorded — awaiting a desktop"

# --- open the newly-synced meeting detail ---
# The synced row has aria-label = meeting.title = the generated date (e.g. "Jun 23, 2026, 11:30 PM").
# Match by date pattern so the tap works regardless of the exact time.
- tapOn:
    text: "Jun.*2026.*"
    index: 0

# The detail view must show the summary from MockSyncClient.syncMeeting().
- assertVisible: "Mock summary — desktop processed."
