appId: ai.minutist.companion
---
# synced-viewer.yaml — capture→sync transition, then read-only detail of a
# synced meeting. All assertions are date-independent (no coupling to today's
# locale date), so the flow does not rot when the calendar rolls over.
#
# Part 1 — record → stop → "Sync now": the captured-unprocessed badge clears,
#   confirming the item transitioned to synced.
# Part 2 — open the stable fixture "Product roadmap review" and assert its
#   read-only detail (title, Summary + Transcript headings, a speaker label).
#
# What Maestro matches = a node's accessibility name. A <button> with an
# aria-label (the synced row) exposes ONLY that name — "Open <title>" — not its
# inner title/snippet text; a <div> with an aria-label (the captured row, the
# detail container) still exposes its descendant text. So the synced content is
# asserted in the detail view (a div), not the list snippet (inside a button).
# RECORD_AUDIO is granted via launchApp permissions.
- launchApp:
    appId: ai.minutist.companion
    clearState: true
    permissions:
      all: allow

# --- part 1: capture → sync transition (no date dependency) ---
- assertVisible: "Ready"
- tapOn: "Start recording"
- assertVisible: "Recording"
- tapOn: "Stop recording"
- assertVisible: "Recorded — awaiting a desktop"
- tapOn: "Sync now"
# Badge gone == the captured item is now synced (transition confirmed, no date).
- assertNotVisible: "Recorded — awaiting a desktop"

# --- part 2: read-only detail of a stable fixture meeting ---
# Maestro matches a node's FULL text/accessibility-name, not a substring, so
# assert whole nodes: the detail <h2> title, the section headings, and a speaker
# label — not a fragment of the long summary paragraph.
- tapOn: "Open Product roadmap review"
- assertVisible: "Product roadmap review"
- assertVisible: "Summary"
- assertVisible: "Transcript"
- assertVisible: "Andrew"
